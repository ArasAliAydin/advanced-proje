<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudySpot</title>
  <meta name="description" content="Çalışma odası ve salon rezervasyonu">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fdb'/%3E%3Cpath d='M9 22V10h8a4 4 0 0 1 0 8h-8' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css?v=6">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/rooms" aria-label="StudySpot ana sayfa">
      <span class="logo" aria-hidden="true">S</span> StudySpot
    </a>
    <nav id="nav" class="nav" hidden>
      <a href="#/rooms" data-route="rooms">Odalar</a>
      <a href="#/me" data-route="me">Rezervasyonlarım</a>
      <a href="#/admin" data-route="admin" id="nav-admin" hidden>Yönetim</a>
    </nav>
    <div id="userbox" class="userbox" hidden>
      <span id="user-name"></span>
      <button type="button" class="btn ghost small" id="logout">Çıkış</button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="muted">Yükleniyor…</p>
  </main>

  <footer class="footer">
    <span>CEN 3001 · StudySpot v2</span>
    <a href="/docs">API dokümantasyonu (Swagger)</a>
  </footer>

  <dialog id="modal" aria-labelledby="modal-title">
    <form method="dialog" class="modal-close-row">
      <h2 id="modal-title"></h2>
      <button class="btn ghost small" aria-label="Kapat">✕</button>
    </form>
    <div id="modal-body"></div>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/static/app.js?v=6"></script>
</body>
</html>
