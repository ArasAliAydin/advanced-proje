<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudySpot</title>
  <meta name="description" content="Çalışma odası ve salon rezervasyonu · Study room and hall booking">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fdb'/%3E%3Cpath d='M9 22V10h8a4 4 0 0 1 0 8h-8' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <script>
    // Seçili tema sayfa çizilmeden uygulanır (açılışta beyaz yanıp sönme olmasın)
    try { var theme = localStorage.getItem("studyspot_theme"); if (theme) document.documentElement.dataset.theme = theme; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/style.css?v=8">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/rooms" data-i18n-aria="app.home">
      <span class="logo" aria-hidden="true">S</span> StudySpot
    </a>
    <nav id="nav" class="nav" hidden>
      <a href="#/rooms" data-route="rooms" data-i18n="nav.rooms">Odalar</a>
      <a href="#/me" data-route="me" data-i18n="nav.me">Rezervasyonlarım</a>
      <a href="#/admin" data-route="admin" id="nav-admin" data-i18n="nav.admin" hidden>Yönetim</a>
    </nav>
    <div class="tools">
      <div id="userbox" class="userbox" hidden>
        <span id="user-name"></span>
        <button type="button" class="btn ghost small" id="logout" data-i18n="nav.logout">Çıkış</button>
      </div>
      <button type="button" class="btn ghost small icon-btn" id="lang-toggle">EN</button>
      <button type="button" class="btn ghost small icon-btn" id="theme-toggle">☾</button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="muted" data-i18n="app.loading">Yükleniyor…</p>
  </main>

  <footer class="footer">
    <span data-i18n="app.footer">CEN 3001 · StudySpot v3</span>
    <a href="/docs" data-i18n="app.swagger">API dokümantasyonu (Swagger)</a>
  </footer>

  <dialog id="modal" aria-labelledby="modal-title">
    <form method="dialog" class="modal-close-row">
      <h2 id="modal-title"></h2>
      <button class="btn ghost small" data-i18n-aria="modal.close" aria-label="Kapat">✕</button>
    </form>
    <div id="modal-body"></div>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/static/i18n.js?v=8"></script>
  <script src="/static/app.js?v=8"></script>
  <script src="/static/admin.js?v=8"></script>
</body>
</html>
