# v2 (geliştirme sürümü): demo sürümü 8000'de çalışırken çakışmasın diye 8001 kullanılır.
name: studyspot-v2

services:
  api:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - studyspot-data:/app/data
    restart: unless-stopped

volumes:
  studyspot-data:
