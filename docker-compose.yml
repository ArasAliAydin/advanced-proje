# Proje adı ve port ortama göre .env ile değişir; dosya her dalda aynı kalır (birleştirmede çakışmaz).
# Varsayılan: sunum demosu -> studyspot-v1, port 8000.
# Geliştirme kopyası (v2) .env içine şunları yazar:  COMPOSE_PROJECT_NAME=studyspot-v2  STUDYSPOT_PORT=8001
name: ${COMPOSE_PROJECT_NAME:-studyspot-v1}

services:
  api:
    build: .
    ports:
      - "${STUDYSPOT_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - studyspot-data:/app/data
    restart: unless-stopped

volumes:
  studyspot-data:
